name: analytics-portfolio

networks:
  analytics-network:
    driver: bridge

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: analytics-nginx
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      master-dashboard:
        condition: service_healthy
    networks:
      - analytics-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  master-dashboard:
    build:
      context: ../..
      dockerfile: master-dashboard/infra/Dockerfile.base
    container_name: analytics-master
    working_dir: /app/master-dashboard
    command: gunicorn app:server --bind 0.0.0.0:8050 --workers 2 --timeout 120
    environment:
      - PORT=8050
      - PYTHONPATH=/app/master-dashboard
    ports:
      - "8050:8050"
    volumes:
      - ../../master-dashboard:/app/master-dashboard:ro
    networks:
      - analytics-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8050/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worldcup:
    build:
      context: ../..
      dockerfile: master-dashboard/infra/Dockerfile.base
    container_name: analytics-worldcup
    working_dir: /app/worldcup-2026
