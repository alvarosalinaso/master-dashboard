# Hub unificado: landing en / + redirects por ruta a puertos
# Nota: Dash usa rutas absolutas /_dash-..., por eso /worldcup -> redirect 302
# al puerto directo (sin romper callbacks). Para proxy con prefijo real,
# setear DASH_URL_BASE_PATHNAME=/worldcup/ en cada app.
upstream master { server master-dashboard:8050; }
upstream worldcup { server worldcup:8051; }
upstream videogames { server videogames:8052; }
upstream geopolitica { server geopolitica:8053; }
upstream geografia { server geografia:8054; }
upstream cajas { server cajas:8055; }
upstream sanitizacion { server sanitizacion:8056; }

server {
    listen 8080;
    server_name _;

    # Landing hub
    location = / {
        proxy_pass http://master/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirects limpios por ruta (evitan romper /_dash-*)
    location = /worldcup { return 302 http://$host:8051/; }
    location = /videogames { return 302 http://$host:8052/; }
    location = /geopolitica { return 302 http://$host:8053/; }
    location = /geografia { return 302 http://$host:8054/; }
    location = /cajas { return 302 http://$host:8055/; }
    location = /sanitizacion { return 302 http://$host:8056/; }

    # Health del proxy
    location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }
}
